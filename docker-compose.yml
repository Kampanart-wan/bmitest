services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bmi
      POSTGRES_PASSWORD: bmi
      POSTGRES_DB: bmi
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmi -d bmi"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://bmi:bmi@db:5432/bmi
      WATCHPACK_POLLING: "true"
    ports:
      - "3100:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
